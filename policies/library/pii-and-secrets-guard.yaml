server:
  public_url: "https://mcp.example.com/mcp"
auth:
  mode: none
upstreams:
  - id: vault
    transport: streamable_http
    url: "https://vault.internal/mcp"
policy:
  default: deny
  rules:
    - name: block-inline-secret-arguments
      tools: ["*"]
      when: >-
        has(args.query) && (
          string(args.query).contains("BEGIN PRIVATE KEY") ||
          string(args.query).contains("AKIA") ||
          string(args.query).contains("ghp_")
        )
      effect: deny
    - name: secrets-require-dpop
      tools: ["vault__read_secret"]
      subjects:
        scopes_all: ["secrets:read"]
      effect: allow
      on_deny:
        require_dpop: true
audit:
  enabled: false
