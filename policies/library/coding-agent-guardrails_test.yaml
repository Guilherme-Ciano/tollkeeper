cases:
  - name: blocks_env_file_read
    principal: { sub: dev, scopes: ["repo:write"] }
    tool: fs__read_file
    args: { path: "/workspace/.env" }
    expect: deny
    rule: block-sensitive-paths
  - name: blocks_path_traversal
    principal: { sub: dev, scopes: ["repo:write"] }
    tool: fs__read_file
    args: { path: "src/../../etc/passwd" }
    expect: deny
    rule: block-sensitive-paths
  - name: allows_safe_read
    principal: { sub: dev }
    tool: fs__read_file
    args: { path: "src/main.go" }
    expect: allow
    rule: allow-workspace-reads
  - name: denies_write_without_scope
    principal: { sub: dev }
    tool: fs__write_file
    args: { path: "src/main.go" }
    expect: deny
    rule: default
  - name: allows_write_with_scope
    principal: { sub: dev, scopes: ["repo:write"] }
    tool: fs__write_file
    args: { path: "src/main.go" }
    expect: allow
    rule: allow-workspace-writes-with-scope
