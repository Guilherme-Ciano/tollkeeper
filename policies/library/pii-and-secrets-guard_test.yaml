cases:
  - name: blocks_private_key_in_args
    principal: { sub: alice, scopes: ["secrets:read"], dpop: true }
    tool: vault__read_secret
    args: { query: "-----BEGIN PRIVATE KEY-----" }
    expect: deny
    rule: block-inline-secret-arguments
  - name: requires_dpop_for_secret_read
    principal: { sub: alice, scopes: ["secrets:read"], dpop: false }
    tool: vault__read_secret
    args: { query: "app/db" }
    expect: step_up
    rule: secrets-require-dpop
  - name: allows_dpop_secret_read
    principal: { sub: alice, scopes: ["secrets:read"], dpop: true }
    tool: vault__read_secret
    args: { query: "app/db" }
    expect: allow
    rule: secrets-require-dpop
