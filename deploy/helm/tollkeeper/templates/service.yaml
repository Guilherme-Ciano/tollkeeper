apiVersion: v1
kind: Service
metadata:
  name: {{ include "tollkeeper.fullname" . }}
  labels:
    {{- include "tollkeeper.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "tollkeeper.selectorLabels" . | nindent 4 }}
  ports:
    - { name: mcp, port: {{ .Values.service.port }}, targetPort: mcp, protocol: TCP }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tollkeeper.fullname" . }}-admin
  labels:
    {{- include "tollkeeper.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  clusterIP: None
  selector:
    {{- include "tollkeeper.selectorLabels" . | nindent 4 }}
  ports:
    - { name: admin, port: {{ .Values.adminService.port }}, targetPort: admin, protocol: TCP }
