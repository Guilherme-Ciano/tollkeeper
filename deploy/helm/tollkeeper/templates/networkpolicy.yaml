{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tollkeeper.fullname" . }}
  labels:
    {{- include "tollkeeper.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tollkeeper.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports: [{ port: mcp, protocol: TCP }]
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - ports: [{ port: admin, protocol: TCP }]
      {{- with .Values.networkPolicy.metricsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
