{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "tollkeeper.fullname" . }}
  labels:
    {{- include "tollkeeper.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "tollkeeper.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: admin
  endpoints:
    - port: admin
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      relabelings:
        - { sourceLabels: [__meta_kubernetes_pod_name], targetLabel: instance }
{{- end }}
