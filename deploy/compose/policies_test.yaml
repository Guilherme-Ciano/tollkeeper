cases:
  - name: reader can search notes
    principal: { sub: alice, client_id: demo-agent, scopes: ["mcp:tools"] }
    tool: notes__search
    annotations: { readOnlyHint: true }
    expect: allow
    rule: readers-can-read
  - name: reader cannot delete files and gets a step-up challenge
    principal: { sub: alice, client_id: demo-agent, scopes: ["mcp:tools"] }
    tool: files__delete_file
    annotations: { destructiveHint: true }
    expect: step_up
    rule: destructive-needs-step-up
    visible: true
  - name: operator with files:write can delete
    principal: { sub: bob, client_id: demo-agent, scopes: ["mcp:tools", "files:write"] }
    tool: files__delete_file
    annotations: { destructiveHint: true }
    expect: allow
  - name: small note is allowed
    principal: { sub: alice, scopes: ["mcp:tools"] }
    tool: notes__create
    args: { title: t, body: "short" }
    expect: allow
    rule: notes-create-capped
  - name: note body over 4096 bytes is denied
    principal: { sub: alice, scopes: ["mcp:tools"] }
    tool: notes__create
    args: { title: t, body: "" }
    expect: deny
    rule: default
  - name: caller without mcp:tools sees nothing
    principal: { sub: mallory, scopes: [] }
    tool: weather__forecast
    expect: deny
    visible: false
