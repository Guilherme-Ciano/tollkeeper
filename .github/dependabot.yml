version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      mcp-go-sdk:
        patterns: ["github.com/modelcontextprotocol/go-sdk"]
      otel:
        patterns: ["go.opentelemetry.io/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
