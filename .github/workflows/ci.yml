name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: go.mod, check-latest: true }
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with: { version: v2.15.0 }
      - run: go run ./internal/tools/nocomments
      - run: go mod tidy -diff
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Verify workflow YAML and full-length SHA pinning
        run: |
          python3 - <<'PY'
          import glob, re, sys, yaml
          sha_re = re.compile(r"^[^@]+@[0-9a-f]{40}$")
          errors = []
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              with open(path, encoding="utf-8") as f:
                  data = yaml.safe_load(f)
              if not isinstance(data, dict):
                  errors.append(f"{path}: invalid workflow YAML")
                  continue
              for jname, job in (data.get("jobs") or {}).items():
                  for idx, step in enumerate((job or {}).get("steps") or []):
                      uses = (step or {}).get("uses")
                      if isinstance(uses, str) and not uses.startswith("./") and not uses.startswith("docker://"):
                          if not sha_re.match(uses.strip()):
                              errors.append(f"{path} job={jname} step={idx}: unpinned action {uses!r}")
          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print("All workflow files valid and SHA-pinned")
          PY
  test:
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tollkeeper
          POSTGRES_PASSWORD: tollkeeper
          POSTGRES_DB: tollkeeper
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tollkeeper" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      TOLLKEEPER_TEST_REDIS_ADDR: 127.0.0.1:6379
      TOLLKEEPER_TEST_POSTGRES_DSN: postgres://tollkeeper:tollkeeper@127.0.0.1:5432/tollkeeper?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: go.mod, check-latest: true }
      - run: go test -race -shuffle=on -count=1 -covermode=atomic -coverprofile=cover.out ./...
      - run: go tool cover -func=cover.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: coverage, path: cover.out }
  coverage-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: go.mod }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: coverage }
      - run: go run ./internal/tools/covbadge -profile cover.out -out "$RUNNER_TEMP/coverage.json"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin badges; then
            git switch badges
          else
            git switch --orphan badges
            git rm -rf --quiet . || true
          fi
          cp "$RUNNER_TEMP/coverage.json" coverage.json
          git add coverage.json
          git diff --cached --quiet || git commit -m "ci: update coverage badge"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  fuzz:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - { pkg: ./internal/gateway, fn: FuzzParseEnvelope }
          - { pkg: ./internal/gateway, fn: FuzzRejectDuplicateKeys }
          - { pkg: ./internal/gateway, fn: FuzzOpenRequestState }
          - { pkg: ./internal/audit, fn: FuzzVerify }
          - { pkg: ./internal/policy, fn: FuzzPolicyArgs }
          - { pkg: ./internal/catalog, fn: FuzzQualify }
          - { pkg: ./internal/audit/anchor, fn: FuzzReceiptVerifier }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: go.mod }
      - run: go test -run='^$' -fuzz='^${{ matrix.target.fn }}$' -fuzztime=30s ${{ matrix.target.pkg }}
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: go.mod }
      - run: make build
  ops:
    runs-on: ubuntu-24.04
    env:
      PROMETHEUS_IMAGE: docker.io/prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
      HELM_IMAGE: docker.io/alpine/helm:4.3.2@sha256:848e0fe16e2dfbc19af48a87c6e046f414b0fe5b61c7552f9070f80de896316b
      KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.8.0@sha256:5103f6f5e89061728aad4ad5a250627dd0fc9b2a92eb876f3762677a4222f9e0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check and unit-test the alert rules
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy/prometheus:/rules:ro" "$PROMETHEUS_IMAGE" check rules /rules/alerts.yml
          docker run --rm --entrypoint /bin/promtool -w /rules -v "$PWD/deploy/prometheus:/rules:ro" "$PROMETHEUS_IMAGE" test rules alerts_test.yml
      - name: Dashboard is valid JSON
        run: python3 -m json.tool deploy/grafana/dashboards/tollkeeper.json > /dev/null
      - name: Chart alerts match deploy/prometheus/alerts.yml
        run: diff -u deploy/prometheus/alerts.yml deploy/helm/tollkeeper/files/alerts.yml
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: go.mod }
      - name: Lint, render and validate the Helm chart
        run: |
          set -euo pipefail
          helm() { docker run --rm -v "$PWD/deploy/helm:/charts:ro" -w /charts --entrypoint helm "$HELM_IMAGE" "$@"; }
          helm lint tollkeeper --strict
          helm lint tollkeeper --strict -f tollkeeper/ci/full-values.yaml
          helm template t tollkeeper > default.yaml
          helm template t tollkeeper -f tollkeeper/ci/full-values.yaml > full.yaml
          docker run --rm -v "$PWD:/w:ro" "$KUBECONFORM_IMAGE" -summary -strict -kubernetes-version 1.33.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /w/default.yaml /w/full.yaml
          python3 -c 'import sys,yaml; d=[x for x in yaml.safe_load_all(open("full.yaml")) if x and x["kind"]=="ConfigMap"][0]; open("chart-config.yaml","w").write(d["data"]["config.yaml"])'
          POD_NAME=t-tollkeeper-0 TOLLKEEPER_AUDIT__POSTGRES__DSN=postgres://u:p@pg/tk go run ./cmd/tollkeeper config validate -c chart-config.yaml
  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: go.mod }
      - run: docker compose --profile obs config -q
      - run: docker compose up --build -d --wait
      - run: go run ./cmd/democlient
      - run: docker compose exec -T gateway /usr/local/bin/tollkeeper audit verify -f /var/log/tollkeeper/audit.jsonl --pubkey /var/lib/tollkeeper/keys/audit-ed25519.pub
      - if: always()
        run: docker compose logs --no-color | tail -200
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: docker buildx build --platform linux/amd64,linux/arm64 --target gateway .
  release-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: go.mod }
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: "check"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: "release --snapshot --clean --skip=sign,publish,docker,sbom,before"
      - name: Verify Dockerfile.release builds with snapshot binary
        run: |
          mkdir -p /tmp/release-ctx/linux/amd64
          cp dist/tollkeeper_linux_amd64_v1/tollkeeper /tmp/release-ctx/linux/amd64/tollkeeper
          docker build -f Dockerfile.release --build-arg TARGETPLATFORM=linux/amd64 /tmp/release-ctx
  ci-gate:
    name: ci-gate
    if: always()
    needs: [lint, test, fuzz, build, ops, compose, docker, release-check]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "CI job results: $RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled|skipped)"'; then
            echo "::error::One or more required CI jobs did not succeed"
            exit 1
          fi
