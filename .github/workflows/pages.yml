name: pages
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".release-please-manifest.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Stamp current release version from manifest
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys
          version = json.loads(pathlib.Path(".release-please-manifest.json").read_text(encoding="utf-8"))["."]
          index = pathlib.Path("site/index.html")
          html = index.read_text(encoding="utf-8")
          updated, n = re.subn(
              r'(<span id="release-version">)[^<]*(</span>)',
              rf"\g<1>v{version}\g<2>",
              html,
          )
          if n != 1:
              sys.exit(f"expected 1 release-version span in site/index.html, found {n}")
          index.write_text(updated, encoding="utf-8")
          print(f"Stamped site version: v{version}")
          PY
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
